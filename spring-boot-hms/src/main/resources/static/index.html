<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MercyCare HMS — Spring Boot + Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-semibold">MercyCare HMS</span>
    <div class="ms-auto">
      <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Sign Out</button>
    </div>
  </nav>

  <main class="container py-4">
    <section id="loginView" class="row justify-content-center py-5">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
          <h4 class="mb-3">Administrator Login</h4>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username or Email</label>
              <input id="username" class="form-control" value="admin" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" value="Admin@123" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>
        </div>
      </div>
    </section>

    <section id="appView" class="d-none">
      <div class="row g-3 mb-4" id="kpiCards"></div>
      <ul class="nav nav-tabs mb-3" id="hmsTabs">
        <li class="nav-item"><button class="nav-link active" data-tab="doctors">Doctors</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="patients">Patients</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="appointments">Appointments</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="bills">Billing</button></li>
      </ul>
      <div id="tabContent" class="card border-0 shadow-sm p-3 bg-white"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
